<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* HEADER */
header{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

header h2{letter-spacing:1px;}

header a{
    background:#ff4d6d;
    padding:8px 20px;
    border-radius:25px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    transition:0.3s;
}
header a:hover{
    background:#ff1e4d;
    transform:scale(1.08);
}

/* DASHBOARD */
.dashboard{padding:40px;}

/* COUNT BOXES */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:25px;
    margin-bottom:40px;
}

.stat-box{
    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(14px);
    padding:28px;
    border-radius:18px;
    text-align:center;
    transition:0.3s;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.stat-box:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 0 25px rgba(0,255,200,0.5);
}

.stat-box h3{
    font-size:32px;
    color:#00ffd5;
    margin-bottom:5px;
}

/* ADMIN CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(12px);
    padding:32px;
    border-radius:18px;
    text-align:center;
    transition:0.3s;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 35px rgba(0,255,213,0.6);
}

.card h3{margin-bottom:10px;}

.card a{
    display:inline-block;
    margin-top:14px;
    padding:10px 24px;
    background:linear-gradient(45deg,#00ffd5,#00aaff);
    color:black;
    text-decoration:none;
    border-radius:25px;
    font-weight:bold;
    transition:0.3s;
}

.card a:hover{
    transform:scale(1.1);
    box-shadow:0 0 15px #00ffd5;
}
</style>
</head>

<body>

<header>
    <h2>🛠 Admin Dashboard</h2>
    <a href="/logout">Logout</a>
</header>

<div class="dashboard">

<!-- COUNT BOXES -->
<div class="stats">

    <div class="stat-box">
        <h3>{{ total_pets }}</h3>
        <p>Total Pets</p>
    </div>

    <div class="stat-box">
        <h3>{{ adopted_pets }}</h3>
        <p>Adopted Pets</p>
    </div>

    <div class="stat-box">
        <h3>{{ total_users }}</h3>
        <p>Total Users</p>
    </div>

</div>

<!-- ADMIN CARDS -->
<div class="cards">

<div class="card">
    <h3>🐾 Manage Pets</h3>
    <p>Add / Edit / Delete Pets</p>
    <a href="/admin-pets">Open</a>
</div>

<div class="card">
    <h3>📋 View Adoptions</h3>
    <p>See adoption requests</p>
    <a href="/admin-adoptions">Open</a>
</div>

<div class="card">
    <h3>👤 Users</h3>
    <p>Registered users list</p>
    <a href="/admin-users">Open</a>
</div>

<div class="card">
    <h3>💖 Donations</h3>
    <p>Donation records</p>
    <a href="/admin-donation">Open</a>
</div>

</div>
</div>

</body>
</html>
