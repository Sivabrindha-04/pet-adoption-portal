<!DOCTYPE html>
<html>
<head>
<title>My Wishlist</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f4f6f9;
}

/* HEADER */
header{
    background:#2c3e50;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
}
header a{
    color:white;
    background:#3498db;
    padding:8px 14px;
    border-radius:6px;
}

/* GRID */
.container{
    padding:40px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:25px;
}

/* CARD */
.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 18px rgba(0,0,0,0.15);
    transition:.3s;
}
.card:hover{
    transform:translateY(-6px);
    box-shadow:0 14px 28px rgba(0,0,0,0.25);
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
}

.card-body{
    padding:15px;
    text-align:center;
}
.card-body h3{margin:10px 0 5px;}
.card-body p{margin:4px 0;color:#555;}

button{
    margin-top:10px;
    padding:10px;
    width:100%;
    border:none;
    background:#e74c3c;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}
button:hover{background:#c0392b;}

.empty{
    text-align:center;
    font-size:18px;
    color:#777;
    margin-top:40px;
}
</style>
</head>

<body>

<header>
    <h2>❤️ My Wishlist</h2>
    <a href="/pets">⬅ Back to Dashboard</a>
</header>

<div class="container">
<div class="grid">

{% if pets %}
    {% for pet in pets %}
    <div class="card">
        <img src="{{ pet.image_url }}">
        <div class="card-body">
            <h3>{{ pet.pet_name }}</h3>
            <p>{{ pet.breed }}</p>
            <p>₹{{ pet.price }}</p>
            <a href="/remove-wishlist/{{ pet.pet_id }}">
                <button>Remove</button>
            </a>
        </div>
    </div>
    {% endfor %}
{% else %}
    <div class="empty">Your wishlist is empty 🐾</div>
{% endif %}

</div>
</div>

</body>
</html>
