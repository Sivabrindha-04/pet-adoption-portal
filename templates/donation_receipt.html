<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donation Receipt</title>
<style>
body {
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:url("https://images.pexels.com/photos/8386184/pexels-photo-8386184.jpeg") no-repeat center/cover;
    background-size:cover;
}
.receipt-box {
    background: rgba(255,255,255,0.95);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    max-width: 450px;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
}
.receipt-box h2 {
    color: #27ae60;
    margin-bottom: 20px;
}
.receipt-box p {
    margin: 10px 0;
    font-size: 16px;
}
button {
    padding: 12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2980b9;
    color:white;
    margin-top:20px;
}
button:hover {
    background:#21618c;
}
</style>
</head>
<body>
<div class="receipt-box">
    <h2>Payment Successful ✅</h2>
    <p><strong>Donor Name:</strong> {{ donation.name }}</p>
    <p><strong>Email:</strong> {{ donation.email }}</p>
    <p><strong>Amount:</strong> ₹{{ donation.amount }}</p>
    <p><strong>Payment Method:</strong> {{ donation.payment_method }}</p>
    <p><strong>Date:</strong> {{ donation.donation_date }}</p>
    <a href="/dashboard"><button>Back to Dashboard</button></a>
    <button onclick="window.print()">Print Receipt</button>
</div>
</body>
</html>
