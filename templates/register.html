<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | Pet Adoption Portal</title>
<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    height:100vh;
    font-family:Arial, sans-serif;
    background:url('https://images.pexels.com/photos/29507137/pexels-photo-29507137.jpeg') no-repeat center/cover;
    background-size: cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Form container with glass effect */
.form-container{
    width: 400px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    border: 1px solid rgba(255, 255, 255, 0.3);
    text-align: center;
    color: #fff;
}

.form-container h2{
    margin-bottom: 20px;
}

/* Input fields */
.form-container input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

/* Submit button */
.form-container button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#28a745;
    border:none;
    color:#fff;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

/* Link to login */
.form-container p{
    margin-top:15px;
}
.form-container a{
    color:#fff;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="form-container">
    <h2>User Registration</h2>
    
    <!-- Registration form -->
    <form method="POST" action="/register">
        <input type="text" name="full_name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

    <p>Already registered? <a href="/">Login here</a></p>
</div>

</body>
</html>
