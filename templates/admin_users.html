<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registered Users</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    padding:40px;
}

/* Card container */
.container{
    max-width:900px;
    margin:auto;
    background:#ffffff;
    padding:30px;
    border-radius:14px;
    box-shadow:0 12px 35px rgba(0,0,0,0.25);
    animation:fadeIn 0.5s ease-in-out;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#203a43;
}

/* Search bar */
.search-box{
    margin-bottom:20px;
    text-align:right;
}

.search-box input{
    padding:10px 14px;
    border-radius:8px;
    border:1px solid #bbb;
    width:220px;
    outline:none;
    transition:0.3s;
}

.search-box input:focus{
    border-color:#1abc9c;
    box-shadow:0 0 6px rgba(26,188,156,0.5);
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#203a43;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#e8f8f5;
    transition:0.2s;
}

/* Back button */
.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 18px;
    background:#1abc9c;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:600;
    transition:0.3s;
}

.back-btn:hover{
    background:#16a085;
    transform:translateY(-2px);
}

/* Animation */
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

/* Mobile responsive */
@media(max-width:600px){
    table,thead,tbody,th,td,tr{
        display:block;
    }
    tr{
        margin-bottom:15px;
        border:1px solid #ddd;
        border-radius:10px;
        padding:10px;
    }
    td{
        border:none;
        padding:6px 0;
    }
}
</style>

<script>
function searchUser(){
    let input=document.getElementById("search").value.toLowerCase();
    let rows=document.querySelectorAll("tbody tr");

    rows.forEach(row=>{
        let text=row.innerText.toLowerCase();
        row.style.display=text.includes(input)?"":"none";
    });
}
</script>

</head>

<body>

<div class="container">

<h2>👤 Registered Users</h2>

<div class="search-box">
<input type="text" id="search" placeholder="Search users..." onkeyup="searchUser()">
</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
</tr>
</thead>

<tbody>
{% for u in users %}
<tr>
<td>{{ u.user_id }}</td>
<td>{{ u.full_name }}</td>
<td>{{ u.email }}</td>
</tr>
{% endfor %}
</tbody>
</table>

<a href="/admin-dashboard" class="back-btn">⬅ Back to Dashboard</a>

</div>

</body>
</html>
