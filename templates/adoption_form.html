<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dog Adoption Form</title>

<style>
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.form-box{
    width:900px;
    background:rgba(255,255,255,0.95);
    padding:30px;
    border-radius:20px;
    color:#333;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    transition: transform 0.3s;
}
.form-box:hover{
    transform: translateY(-5px);
}

h2{text-align:center;margin-bottom:20px;color:#764ba2;}

/* FLEX LAYOUT */
.form-container{
    display:flex;
    gap:40px;
}

/* LEFT SIDE - PET */
.pet-section{flex:1;}
.pet-img{
    width:100%;
    height:220px;
    border-radius:12px;
    background-size:cover;
    background-position:center;
    margin-bottom:15px;
    transition: transform 0.3s;
}
.pet-img:hover{transform: scale(1.05);}

/* RIGHT SIDE - USER */
.user-section{flex:1;}

label{
    margin-top:10px;
    display:block;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:2px solid #ccc;
    border-radius:8px;
    transition: all 0.3s;
    font-size:14px;
}
input:focus, textarea:focus{
    border-color:#764ba2;
    box-shadow: 0 0 5px #764ba2;
    outline:none;
}

textarea{resize:none;}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:linear-gradient(90deg,#667eea,#764ba2);
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition: all 0.3s;
}
button:hover{
    transform: translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div class="form-box">
<h2>Pet Adoption Form</h2>

<form method="POST" action="/save-adoption" class="form-container">

    <!-- LEFT SIDE (PET DETAILS) -->
    <div class="pet-section">

        <div id="petImg" class="pet-img"></div>

        <label>Pet Name</label>
        <input type="text" name="pet_name" id="petName" readonly>

        <label>Pet ID</label>
        <input type="text" name="pet_id" id="petID" readonly>


        <label>Breed</label>
        <input type="text" name="pet_breed" id="petBreed" readonly>

        <label>Age</label>
        <input type="text" name="pet_age" id="petAge" readonly>

        <label>Adoption Price</label>
        <input type="text" name="pet_price" id="petPrice" readonly>

    </div>

    <!-- RIGHT SIDE (USER DETAILS) -->
    <div class="user-section">

        <label>Your Name</label>
        <input type="text" name="user_name" id="userName" required>

        <label>Email</label>
        <input type="email" name="user_email" id="email" required>

        <label>Phone</label>
        <input type="tel" name="user_phone" id="phone" required>

        <label>Address</label>
        <textarea name="user_address" id="address" rows="4"></textarea>

        <label>Do you own pets before?</label>
        <select name="pet_experience">
        <option>Yes</option>
        <option>No</option></select>

        <label>Reason for adoption(optional)</label>
        <textarea name="reason"></textarea>


        <button type="submit">Proceed to Payment</button>

    </div>

</form>
</div>

<script>
window.onload = function(){
    const pet = JSON.parse(localStorage.getItem("adoptPet"));

    if(!pet){
        alert("No pet selected");
        window.location.href="/dashboard";
        return;
    }

    document.getElementById("petName").value = pet.name;
    document.getElementById("petBreed").value = pet.breed;
    document.getElementById("petAge").value = pet.age;
    document.getElementById("petPrice").value = pet.price;

    // ⭐ THIS LINE FILLS PET ID
    document.getElementById("petID").value = pet.id;

    document.getElementById("petImg").style.backgroundImage =
        `url('${pet.img}')`;
};
</script>


</body>
</html>
