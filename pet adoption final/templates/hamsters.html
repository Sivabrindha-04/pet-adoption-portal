<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hamster Adoption</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:url("https://images.pexels.com/photos/31358527/pexels-photo-31358527.jpeg") no-repeat center/cover;
    min-height:100vh;
}

/* HEADER */
header{
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* FILTER */
.filter-box{
    text-align:center;
    margin:20px;
}

select{
    padding:10px;
    border-radius:6px;
    font-size:16px;
}

/* BREED TITLE */
.breed-title{
    margin:30px 20px 10px;
    color:#b7da7a;
    font-size:24px;
    border-left:5px solid #ff9800;
    padding-left:10px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    padding:20px;
}

/* CARD */
.card{
    height:320px;
    border-radius:15px;
    position:relative;
    color:#fff;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.6);
}

.overlay{
    background:rgba(0,0,0,0.65);
    position:absolute;
    bottom:0;
    width:100%;
    padding:15px;
}

.btn{
    padding:7px 12px;
    border:none;
    border-radius:5px;
    margin-top:8px;
    cursor:pointer;
}

.adopt{background:#4CAF50;color:white;}
.wishlist{background:#ff4081;color:white;}
</style>
</head>

<body>

<header>
    <h2>🐹 Hamster Adoption</h2>
    <button onclick="location.href='/dashboard'">⬅ Back to Dashboard</button>
</header>

<div class="filter-box">
    <select id="breedFilter" onchange="filterBreed()">
        <option value="All">All Breeds</option>
        <option value="Syrian">Syrian</option>
        <option value="Dwarf">Dwarf</option>
        <option value="Roborovski">Roborovski</option>
        <option value="Chinese">Chinese</option>
        <option value="Campbell">Campbell</option>
    </select>
</div>

<div id="hamstersContainer"></div>

<script>
const hamsters = {
    "Syrian":[
        {id:"1",name:"Cookie", age:"6 Months", price:"₹1,500", img:"https://images.pexels.com/photos/35282866/pexels-photo-35282866.jpeg"},
        {id:"2",name:"Nibbles", age:"8 Months", price:"₹1,700", img:"https://images.pexels.com/photos/3362697/pexels-photo-3362697.jpeg"}
    ],
    "Dwarf":[
        {id:"3",name:"Peanut", age:"5 Months", price:"₹1,200", img:"https://images.pexels.com/photos/3586056/pexels-photo-3586056.jpeg"},
        {id:"4",name:"Snowball", age:"7 Months", price:"₹1,300", img:"https://images.pexels.com/photos/3586056/pexels-photo-3586056.jpeg"}
    ],
    "Roborovski":[
        {id:"5",name:"Speedy", age:"4 Months", price:"₹1,800", img:"https://images.pexels.com/photos/2013665/pexels-photo-2013665.jpeg"},
        {id:"6",name:"Flash", age:"6 Months", price:"₹2,000", img:"https://images.pexels.com/photos/15373308/pexels-photo-15373308.jpeg"}
    ],
    "Chinese":[
        {id:"7",name:"Whiskers", age:"7 Months", price:"₹1,600", img:"https://images.pexels.com/photos/10884424/pexels-photo-10884424.jpeg"},
        {id:"8",name:"Shadow", age:"9 Months", price:"₹1,750", img:"https://images.pexels.com/photos/4520484/pexels-photo-4520484.jpeg"}
    ],
    "Campbell":[
        {id:"9",name:"Milo", age:"6 Months", price:"₹1,400", img:"https://images.pexels.com/photos/3362698/pexels-photo-3362698.jpeg"},
        {id:"10",name:"Oreo", age:"8 Months", price:"₹1,550", img:"https://images.pexels.com/photos/10884423/pexels-photo-10884423.jpeg"}
    ]
};

function loadHamsters(filter="All"){
    const container=document.getElementById("hamstersContainer");
    container.innerHTML="";

    for(let breed in hamsters){
        if(filter!=="All" && filter!==breed) continue;

        container.innerHTML+=`
        <div class="breed-title">${breed}</div>
        <div class="grid" id="${breed}"></div>`;

        hamsters[breed].forEach(hamster=>{
            document.getElementById(breed).innerHTML+=`
            <div class="card" style="background:url('${hamster.img}') center/cover">
                <div class="overlay">
                    <h3>${hamster.name}</h3>
                    <p>'${hamster.id}'</p>
                    <p>Age: ${hamster.age}</p>
                    <p>Price: ${hamster.price}</p>
                   <button class="btn adopt" onclick="adoptPet(
                   '${hamster.name}',
                   '${hamster.id}',
                   '${hamster.age}',
                   '${breed}',
                   '${hamster.price}',
                   '${hamster.img}'
                   )">Adopt Me</button>
                    <button class="btn wishlist"
                        onclick="addToWishlist('${hamster.name}','${hamster.id}',${breed}','${hamster.img}','${hamster.price}')">
                        Wishlist
                    </button>
                </div>
            </div>`;
        });
    }
}

function filterBreed(){
    loadHamsters(document.getElementById("breedFilter").value);
}

/* WISHLIST */
function addToWishlist(name,id,breed,img,price){
    let wishlist=JSON.parse(localStorage.getItem("wishlist"))||[];
    if(wishlist.some(d=>d.name===name)){
        alert("Already in wishlist ❤️");
        return;
    }
    wishlist.push({name,id,breed,img,price});
    localStorage.setItem("wishlist",JSON.stringify(wishlist));
    alert(name+" added to wishlist 🐾");
}

/* ✅ ADOPT → FLASK ROUTE */
function adoptPet(name,id, age, breed, price, img){
    // Optional: store selected pet
    localStorage.setItem("adoptPet", JSON.stringify({
        name,id,age, breed, price, img
    }));

    // 🔥 CORRECT REDIRECT TO ADOPTION FORM
    window.location.href = "/adoption";
}

loadHamsters();
</script>

</body>
</html>
