<!DOCTYPE html>
<html>
<head>
<title>Delete Pet</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(to right, #ff9a9e, #fecfef);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card{
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
}

h2{
    color: #e74c3c;
}

p{
    margin: 15px 0;
    font-size: 16px;
}

button{
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 10px;
}

.delete-btn{
    background-color: #e74c3c;
    color: white;
}

.cancel-btn{
    background-color: #2ecc71;
    color: white;
}

a{
    text-decoration: none;
}
</style>
</head>
<body>

<div class="card">

    <h2>⚠ Delete Pet</h2>

    <p>Are you sure you want to delete this pet?</p>

    <p><strong>{{ pet.pet_name }}</strong></p>

    <form method="POST">
        <button type="submit" class="delete-btn">Yes, Delete</button>
        <a href="/admin-pets">
            <button type="button" class="cancel-btn">Cancel</button>
        </a>
    </form>

</div>

</body>
</html>
