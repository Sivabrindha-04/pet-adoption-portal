<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dog Adoption</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:url("https://images.pexels.com/photos/58997/pexels-photo-58997.jpeg") no-repeat center/cover;
    min-height:100vh;
}

/* HEADER */
header{
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* FILTER */
.filter-box{
    text-align:center;
    margin:20px;
}

select{
    padding:10px;
    border-radius:6px;
    font-size:16px;
}

/* BREED TITLE */
.breed-title{
    margin:30px 20px 10px;
    color:#fff;
    font-size:24px;
    border-left:5px solid #ff9800;
    padding-left:10px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    padding:20px;
}

/* CARD */
.card{
    height:320px;
    border-radius:15px;
    position:relative;
    color:#fff;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.6);
}

.overlay{
    background:rgba(0,0,0,0.65);
    position:absolute;
    bottom:0;
    width:100%;
    padding:15px;
}

.overlay h3{
    margin:0;
}

.btn{
    padding:7px 12px;
    border:none;
    border-radius:5px;
    margin-top:8px;
    cursor:pointer;
}

.adopt{background:#4CAF50;color:white;}
.wishlist{background:#ff4081;color:white;}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <h2>🐶 Dog Adoption</h2>
    <!-- ✅ Flask dashboard route -->
    <button onclick="location.href='/dashboard'">⬅ Back to Dashboard</button>
</header>

<!-- FILTER -->
<div class="filter-box">
    <select id="breedFilter" onchange="filterBreed()">
        <option value="All">All Breeds</option>
        <option value="Labrador">Labrador</option>
        <option value="German Shepherd">German Shepherd</option>
        <option value="Pug">Pug</option>
        <option value="Golden Retriever">Golden Retriever</option>
        <option value="Beagle">Beagle</option>
    </select>
</div>

<div id="dogsContainer"></div>

<script>
/* DOG DATA */
const dogs = {
"Labrador":[
        {id:"1",name:"Bruno", age:"2 Years", price:"₹8,000", img:"https://images.pexels.com/photos/11512311/pexels-photo-11512311.jpeg"},
        {id:"2",name:"Max", age:"1.5 Years", price:"₹9,000", img:"https://images.pexels.com/photos/11512311/pexels-photo-11512311.jpeg"},
        {id:"3",name:"Charlie", age:"3 Years", price:"₹7,500", img:"https://images.pexels.com/photos/29170726/pexels-photo-29170726.jpeg"},
        {id:"4",name:"Rocky", age:"2 Years", price:"₹8,200", img:"https://images.pexels.com/photos/15005238/pexels-photo-15005238.jpeg"},
        {id:"5",name:"Buddy", age:"1 Year", price:"₹10,000", img:"https://images.pexels.com/photos/248273/pexels-photo-248273.jpeg"}
    ],
    "German Shepherd":[
        {id:"6",name:"Rex", age:"2 Years", price:"₹12,000", img:"https://images.pexels.com/photos/19937242/pexels-photo-19937242.jpeg"},
        {id:"7",name:"Leo", age:"3 Years", price:"₹11,000", img:"https://images.pexels.com/photos/16528286/pexels-photo-16528286.jpeg"},
        {id:"8",name:"Oscar", age:"1.5 Years", price:"₹13,000", img:"https://images.pexels.com/photos/31888574/pexels-photo-31888574.jpeg"},
        {id:"9",name:"Thor", age:"2 Years", price:"₹14,000", img:"https://images.pexels.com/photos/342214/pexels-photo-342214.jpeg"},
        {id:"10",name:"Zeus", age:"2.5 Years", price:"₹15,000", img:"https://images.pexels.com/photos/28704687/pexels-photo-28704687.jpeg"}
    ],
    "Pug":[
        {id:"11",name:"Coco", age:"1 Year", price:"₹6,000", img:"https://images.pexels.com/photos/1591939/pexels-photo-1591939.jpeg"},
        {id:"12",name:"Milo", age:"2 Years", price:"₹6,500", img:"https://images.pexels.com/photos/1618707/pexels-photo-1618707.jpeg"},
        {id:"13",name:"Nemo", age:"1.5 Years", price:"₹7,000", img:"https://images.pexels.com/photos/16657036/pexels-photo-16657036.jpeg"},
        {id:"14",name:"Peanut", age:"2 Years", price:"₹6,800", img:"https://images.pexels.com/photos/3609068/pexels-photo-3609068.jpeg"},
        {id:"15",na5me:"Loki", age:"1 Year", price:"₹7,200", img:"https://images.pexels.com/photos/16729262/pexels-photo-16729262.jpeg"}
    ],
    "Golden Retriever":[
        {id:"16",name:"Simba", age:"2 Years", price:"₹14,000", img:"https://images.pexels.com/photos/15691178/pexels-photo-15691178.jpeg"},
        {id:"17",name:"Bailey", age:"1.5 Years", price:"₹15,000", img:"https://images.pexels.com/photos/10433404/pexels-photo-10433404.jpeg"},
        {id:"18",name:"Shadow", age:"3 Years", price:"₹13,500", img:"https://images.pexels.com/photos/18618490/pexels-photo-18618490.jpeg"},
        {id:"19",name:"Teddy", age:"2 Years", price:"₹14,200", img:"https://images.pexels.com/photos/33757021/pexels-photo-33757021.jpeg"},
        {id:"20",name:"Hunter", age:"1 Year", price:"₹16,000", img:"https://images.pexels.com/photos/8991719/pexels-photo-8991719.jpeg"}
    ],
    "Beagle":[
        {id:"21",name:"Jack", age:"2 Years", price:"₹9,000", img:"https://images.pexels.com/photos/26202784/pexels-photo-26202784.jpeg"},
        {id:"22",name:"Oliver", age:"1.5 Years", price:"₹9,500", img:"https://images.pexels.com/photos/29773484/pexels-photo-29773484.jpeg"},
        {id:"23",name:"Bingo", age:"3 Years", price:"₹8,800", img:"https://images.pexels.com/photos/8706371/pexels-photo-8706371.jpeg"},
        {id:"24",name:"Finn", age:"2 Years", price:"₹9,200", img:"https://images.pexels.com/photos/3764318/pexels-photo-3764318.jpeg"},
        {id:"25",name:"Ben", age:"1 Year", price:"₹10,000", img:"https://images.pexels.com/photos/26202792/pexels-photo-26202792.jpeg"}
    ]
};

/* LOAD DOGS */
function loadDogs(filter="All"){
    const container=document.getElementById("dogsContainer");
    container.innerHTML="";

    for(let breed in dogs){
        if(filter!=="All" && filter!==breed) continue;

        container.innerHTML+=`
            <div class="breed-title">${breed}</div>
            <div class="grid" id="${breed.replace(/\s/g,'')}"></div>
        `;

        dogs[breed].forEach(dog=>{
            document.getElementById(breed.replace(/\s/g,'')).innerHTML+=`
            <div class="card" style="background:url('${dog.img}') center/cover">
                <div class="overlay">
                    <h3>${dog.name}</h3>
                    <p>ID:${dog.id}</p>
                    <p>Age: ${dog.age}</p>
                    <p>Price: ₹${dog.price}</p>

                    <!-- ✅ ADOPTION -->
                    <button class="btn adopt" onclick="adoptPet(
                   '${dog.name}',
                   '${dog.id}',
                   '${dog.age}',
                   '${breed}',
                   '${dog.price}',
                   '${dog.img}'
                   )">Adopt Me</button>


                    <!-- WISHLIST -->
                    <button class="btn wishlist"
                        onclick="addToWishlist('${dog.name}','${dog.id}',${breed}','${dog.img}','${dog.price}')">
                        Wishlist
                    </button>
                </div>
            </div>`;
        });
    }
}

function filterBreed(){
    loadDogs(document.getElementById("breedFilter").value);
}

/* WISHLIST */
function addToWishlist(name,id,breed,img,price){
    let wishlist=JSON.parse(localStorage.getItem("wishlist"))||[];
    if(wishlist.some(d=>d.name===name)){
        alert("Already in wishlist ❤️");
        return;
    }
    wishlist.push({name,id,breed,img,price});
    localStorage.setItem("wishlist",JSON.stringify(wishlist));
    alert(name+" added to wishlist 🐾");
}

/* ✅ ADOPT → FLASK ROUTE */
function adoptPet(name,id, age, breed, price, img){
    // Optional: store selected pet
    localStorage.setItem("adoptPet", JSON.stringify({
        name,id,age, breed, price, img
    }));

    // 🔥 CORRECT REDIRECT TO ADOPTION FORM
    window.location.href = "/adoption";
}
loadDogs();
</script>

</body>
</html>
