<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:url("https://images.pexels.com/photos/35271871/pexels-photo-35271871.jpeg")
    no-repeat center/cover;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* LOGIN CARD */
.login-card{
    width:340px;
    background:rgba(0,0,0,0.8);
    padding:30px 25px;
    border-radius:12px;
    color:#fff;
}

/* TITLE */
.login-card h2{
    text-align:center;
    margin-bottom:20px;
}

/* INPUTS */
.login-card label{
    display:block;
    margin-top:15px;
    font-size:14px;
}

.login-card input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:6px;
    font-size:14px;
}

/* BUTTONS */
.btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    margin-top:18px;
    font-size:15px;
    cursor:pointer;
}

.login-btn{
    background:#ff9800;
    color:#fff;
}

.back-btn{
    background:#555;
    color:#fff;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="login-card">
    <h2>🔐 Admin Login</h2>

    <!-- ADMIN LOGIN FORM -->
    <form method="POST" action="/admin-login">

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter admin username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter admin password" required>

        <button type="submit" class="btn login-btn">Login</button>
    </form>
    <div class="links">
    <a href="/admin-dashboard"></a>

    <!-- BACK TO USER LOGIN -->
    <a href="/" ><button class="btn back-btn" type="button">⬅ Back to User Login</button></a>
    </div>
</div>

</body>
</html>
