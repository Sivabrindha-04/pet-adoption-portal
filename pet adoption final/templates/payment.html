<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment</title>
<style>
/* Body */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Payment Box */
.box {
    width: 450px;
    background: #ffffff;
    padding: 40px 35px;
    border-radius: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.3s;
}

.box:hover {
    transform: translateY(-5px);
}

/* Heading */
h2 {
    font-size: 28px;
    color: #764ba2;
    margin-bottom: 20px;
    text-align: center;
}

/* Amount */
#amount {
    font-size: 22px;
    font-weight: bold;
    color: #ff4c8b;
    margin-bottom: 25px;
}

/* Dropdown */
select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
    margin-bottom: 20px;
    transition: all 0.3s;
}

select:focus {
    border-color: #764ba2;
    box-shadow: 0 0 8px #764ba2;
    outline: none;
}

/* Input fields */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    transition: all 0.3s;
}

input:focus {
    border-color: #764ba2;
    box-shadow: 0 0 8px #764ba2;
    outline: none;
}

/* Pay button */
button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(to right, #764ba2, #667eea);
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-size: 18px;
    margin-top: 10px;
    transition: all 0.3s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* Payment Icons */
.payment-icons {
    display: flex;
    justify-content: flex-start;
    gap: 20px;
    margin-bottom: 15px;
}

.payment-icons img {
    width: 60px;
    cursor: pointer;
    border-radius: 10px;
    transition: transform 0.3s, filter 0.3s;
}

.payment-icons img:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 10px #764ba2);
}

.payment-icons img.selected {
    border: 2px solid #764ba2;
    box-shadow: 0 0 10px #764ba2;
}

/* Sections */
.section {
    display: none;
    width: 100%;
}

/* Error message */
.error {
    color: red;
    font-size: 14px;
    margin-bottom: 10px;
    display: none;
    text-align: left;
}
</style>
</head>
<body>

<div class="box">
    <h2>💳 Payment</h2>
    <p><b>Amount:</b> <span id="amount"></span></p>

    <!-- Payment Method Dropdown -->
    <label>Select Payment Method</label>
    <select id="paymentMethod" onchange="showSection()">
        <option value="">-- Select --</option>
        <option value="upi">UPI</option>
        <option value="card">Credit/Debit Card</option>
        <option value="netbanking">Net Banking</option>
    </select>

    <!-- UPI Section -->
    <div class="section" id="upi-section">
        <div class="payment-icons">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/PhonePe_Logo.png" alt="GPay" onclick="selectUPI(this)">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/PhonePe_Logo.png" alt="PhonePe" onclick="selectUPI(this)">
        </div>
        <input type="text" id="upiId" placeholder="Enter UPI ID">
        <div class="error" id="upiError">Please select a UPI app and enter UPI ID.</div>
    </div>

    <!-- Card Section -->
    <div class="section" id="card-section">
        <input type="text" id="cardNumber" placeholder="Card Number">
        <input type="text" id="cardName" placeholder="Card Holder Name">
        <input type="text" id="cardExpiry" placeholder="Expiry MM/YY">
        <input type="text" id="cardCVV" placeholder="CVV">
        <div class="error" id="cardError">Please fill all card details.</div>
    </div>

    <!-- Net Banking Section -->
    <div class="section" id="netbanking-section">
        <input type="text" id="bankName" placeholder="Bank Name">
        <input type="text" id="accountNumber" placeholder="Account Number">
        <div class="error" id="netbankError">Please fill all net banking details.</div>
    </div>

    <button onclick="payNow()">Pay Now</button>
</div>

<script>
// Load amount
const pet = JSON.parse(localStorage.getItem("adoptPet")) || {price: "₹500"};
document.getElementById("amount").innerText = pet.price;

// Show section based on dropdown
function showSection() {
    const method = document.getElementById("paymentMethod").value;
    document.getElementById("upi-section").style.display = (method === "upi") ? "block" : "none";
    document.getElementById("card-section").style.display = (method === "card") ? "block" : "none";
    document.getElementById("netbanking-section").style.display = (method === "netbanking") ? "block" : "none";
}

// UPI selection
function selectUPI(elem) {
    document.querySelectorAll('.payment-icons img').forEach(img => img.classList.remove('selected'));
    elem.classList.add('selected');
}

// Payment validation
function payNow() {
    const method = document.getElementById("paymentMethod").value;
    document.querySelectorAll('.error').forEach(e => e.style.display = 'none');

    if(method === "upi") {
        const upiId = document.getElementById("upiId").value.trim();
        const upiApp = document.querySelector('.payment-icons img.selected');
        if(!upiId || !upiApp) {
            document.getElementById("upiError").style.display = 'block';
            return;
        }
    } else if(method === "card") {
        const cardNumber = document.getElementById("cardNumber").value.trim();
        const cardName = document.getElementById("cardName").value.trim();
        const cardExpiry = document.getElementById("cardExpiry").value.trim();
        const cardCVV = document.getElementById("cardCVV").value.trim();
        if(!cardNumber || !cardName || !cardExpiry || !cardCVV) {
            document.getElementById("cardError").style.display = 'block';
            return;
        }
    } else if(method === "netbanking") {
        const bankName = document.getElementById("bankName").value.trim();
        const accountNumber = document.getElementById("accountNumber").value.trim();
        if(!bankName || !accountNumber) {
            document.getElementById("netbankError").style.display = 'block';
            return;
        }
    } else {
        alert("Please select a payment method!");
        return;
    }

    localStorage.setItem("paymentMethod", method);
    alert("Payment Successful ✅");
    window.location.href = "/receipt";
}

// Initialize
showSection();
</script>

</body>
</html>
