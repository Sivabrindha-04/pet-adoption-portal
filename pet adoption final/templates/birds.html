<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bird Adoption</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:url("https://images.pexels.com/photos/30600142/pexels-photo-30600142.jpeg") no-repeat center/cover;
    min-height:100vh;
}

/* HEADER */
header{
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* FILTER */
.filter-box{
    text-align:center;
    margin:20px;
}

select{
    padding:10px;
    border-radius:6px;
    font-size:16px;
}

/* BREED TITLE */
.breed-title{
    margin:30px 20px 10px;
    color:#fff;
    font-size:24px;
    border-left:5px solid #ff9800;
    padding-left:10px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    padding:20px;
}

/* CARD */
.card{
    height:320px;
    border-radius:15px;
    position:relative;
    color:#fff;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.6);
}

.overlay{
    background:rgba(0,0,0,0.65);
    position:absolute;
    bottom:0;
    width:100%;
    padding:15px;
}

.btn{
    padding:7px 12px;
    border:none;
    border-radius:5px;
    margin-top:8px;
    cursor:pointer;
}

.adopt{background:#4CAF50;color:white;}
.wishlist{background:#ff4081;color:white;}
</style>
</head>

<body>

<header>
    <h2>🐦 Bird Adoption</h2>
    <button onclick="location.href='/dashboard'">⬅ Back to Dashboard</button>
</header>

<div class="filter-box">
    <select id="breedFilter" onchange="filterBreed()">
        <option value="All">All Breeds</option>
        <option value="Parakeet">Parakeet</option>
        <option value="Cockatiel">Cockatiel</option>
        <option value="Canary">Canary</option>
        <option value="Finch">Finch</option>
        <option value="Lovebird">Lovebird</option>
    </select>
</div>

<div id="birdsContainer"></div>

<script>
const birds = {
    "Parakeet":[
        {id:"1",name:"Bluey", age:"6 Months", price:"₹2,000", img:"https://images.pexels.com/photos/30600151/pexels-photo-30600151.jpeg"},
        {id:"2",name:"Greenie", age:"1 Year", price:"₹2,200", img:"https://images.pexels.com/photos/30600146/pexels-photo-30600146.jpeg"},
        {id:"3",name:"Jackie", age:"3 years", price:"₹2,500",img:"https://images.pexels.com/photos/16290713/pexels-photo-16290713.jpeg"}
    ],
    "Cockatiel":[
        {id:"4",name:"Sunny", age:"1 Year", price:"₹3,500", img:"https://images.pexels.com/photos/6640543/pexels-photo-6640543.jpeg"},
        {id:"5",name:"Charlie", age:"1.5 Years", price:"₹3,800", img:"https://images.pexels.com/photos/30600136/pexels-photo-30600136.jpeg"},
        {id:"6",name:"Chakie",age:"9 months",price:"₹2,000",img:"https://images.pexels.com/photos/35211118/pexels-photo-35211118.jpeg"}
    ],
    "Canary":[
        {id:"7",name:"Goldie", age:"8 Months", price:"₹2,800", img:"https://images.pexels.com/photos/19291559/pexels-photo-19291559.jpeg"},
        {id:"8",name:"Sunny", age:"1 Year", price:"₹3,000", img:"https://images.pexels.com/photos/18701601/pexels-photo-18701601.jpeg"},
        {id:"9",name:"Bunn",age:"2.5 years",price:"₹1,800",img:"https://images.pexels.com/photos/1300353/pexels-photo-1300353.jpeg"}
    ],
    "Finch":[
        {id:"10",name:"Tiny", age:"6 Months", price:"₹1,500", img:"https://images.pexels.com/photos/35251135/pexels-photo-35251135.jpeg"},
        {id:"11",name:"Peppy", age:"1 Year", price:"₹1,700", img:"https://images.pexels.com/photos/18542799/pexels-photo-18542799.jpeg"},
        {id:"12",name:"Lasi", age:"4 years",price:"₹1,600",img:"https://images.pexels.com/photos/35210561/pexels-photo-35210561.jpeg"}
    ],
    "Lovebird":[
        {id:"13",name:"Rosie", age:"1 Year", price:"₹3,000", img:"https://images.pexels.com/photos/35276101/pexels-photo-35276101.jpeg"},
        {id:"14",name:"Buddy", age:"1.2 Years", price:"₹3,200", img:"https://images.pexels.com/photos/30284788/pexels-photo-30284788.jpeg"},
        {id:"15",name:"Nene", age:"1.5 years",price:"₹2,200",img:"https://images.pexels.com/photos/30651005/pexels-photo-30651005.jpeg"}
    ]
};

function loadBirds(filter="All"){
    const container=document.getElementById("birdsContainer");
    container.innerHTML="";

    for(let breed in birds){
        if(filter!=="All" && filter!==breed) continue;

        container.innerHTML+=`
        <div class="breed-title">${breed}</div>
        <div class="grid" id="${breed.replaceAll(' ','')}"></div>`;

        birds[breed].forEach(bird=>{
            document.getElementById(breed.replaceAll(' ','')).innerHTML+=`
            <div class="card" style="background:url('${bird.img}') center/cover">
                <div class="overlay">
                    <h3>${bird.name}</h3>
                    <p>ID:${bird.id}</p>
                    <p>Age: ${bird.age}</p>
                    <p>Price: ${bird.price}</p>
                   <button class="btn adopt" onclick="adoptPet(
                   '${bird.name}',
                   '${bird.id}',
                   '${bird.age}',
                   '${breed}',
                   '${bird.price}',
                   '${bird.img}'
                   )">Adopt Me</button>
                    <button class="btn wishlist"
                        onclick="addToWishlist('${bird.name}','${bird.id}',${breed}','${bird.img}','${bird.price}')">
                        Wishlist
                    </button>
                </div>
            </div>`;
        });
    }
}

function filterBreed(){
    loadBirds(document.getElementById("breedFilter").value);
}

/* WISHLIST */
function addToWishlist(name,id,breed,img,price){
    let wishlist=JSON.parse(localStorage.getItem("wishlist"))||[];
    if(wishlist.some(d=>d.name===name)){
        alert("Already in wishlist ❤️");
        return;
    }
    wishlist.push({name,id,breed,img,price});
    localStorage.setItem("wishlist",JSON.stringify(wishlist));
    alert(name+" added to wishlist 🐾");
}

/* ✅ ADOPT → FLASK ROUTE */
function adoptPet(name,id, age, breed, price, img){
    // Optional: store selected pet
    localStorage.setItem("adoptPet", JSON.stringify({
        name, id,age, breed, price, img
    }));

    // 🔥 CORRECT REDIRECT TO ADOPTION FORM
    window.location.href = "/adoption";
}

loadBirds();
</script>

</body>
</html>
