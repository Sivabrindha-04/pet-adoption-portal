<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cat Adoption</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:url("https://images.pexels.com/photos/15575358/pexels-photo-15575358.jpeg") no-repeat center/cover;
    min-height:100vh;
}

/* HEADER */
header{
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* FILTER */
.filter-box{
    text-align:center;
    margin:20px;
}

select{
    padding:10px;
    border-radius:6px;
    font-size:16px;
}

/* BREED TITLE */
.breed-title{
    margin:30px 20px 10px;
    color:#fff;
    font-size:24px;
    border-left:5px solid #ff9800;
    padding-left:10px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
    padding:20px;
}

/* CARD */
.card{
    height:320px;
    border-radius:15px;
    position:relative;
    color:#fff;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.6);
}

.overlay{
    background:rgba(0,0,0,0.65);
    position:absolute;
    bottom:0;
    width:100%;
    padding:15px;
}

.overlay h3{
    margin:0;
}

.btn{
    padding:7px 12px;
    border:none;
    border-radius:5px;
    margin-top:8px;
    cursor:pointer;
}

.adopt{background:#4CAF50;color:white;}
.wishlist{background:#ff4081;color:white;}
</style>
</head>

<body>

<header>
    <h2>🐱 Cat Adoption</h2>
    <button onclick="location.href='/dashboard'">⬅ Back to Dashboard</button>
</header>

<div class="filter-box">
    <select id="breedFilter" onchange="filterBreed()">
        <option value="All">All Breeds</option>
        <option value="Persian">Persian</option>
        <option value="Siamese">Siamese</option>
        <option value="Maine">Maine Coon</option>
        <option value="Bengal">Bengal</option>
        <option value="Ragdoll">Ragdoll</option>
    </select>
</div>

<div id="catsContainer"></div>

<script>
const cats = {
   "Persian":[
        {id:"1",name:"Bruno", age:"2 Years", price:"₹8,000", img:"https://images.pexels.com/photos/6131540/pexels-photo-6131540.jpeg"},
        {id:"2",name:"Max", age:"1.5 Years", price:"₹9,000", img:"https://images.pexels.com/photos/15765391/pexels-photo-15765391.jpeg"},
        {id:"3",name:"Charlie", age:"3 Years", price:"₹7,500", img:"https://images.pexels.com/photos/1644767/pexels-photo-1644767.jpeg"},
        {id:"4",name:"Rocky", age:"2 Years", price:"₹8,200", img:"https://images.pexels.com/photos/7445032/pexels-photo-7445032.jpeg"},
        {id:"5",name:"Buddy", age:"1 Year", price:"₹10,000", img:"https://images.pexels.com/photos/14840603/pexels-photo-14840603.jpeg"}
    ],
    "Siamese":[
        {id:"6",name:"Rex", age:"2 Years", price:"₹12,000", img:"https://images.pexels.com/photos/20001743/pexels-photo-20001743.jpeg"},
        {id:"7",name:"Leo", age:"3 Years", price:"₹11,000", img:"https://images.pexels.com/photos/7445055/pexels-photo-7445055.jpeg"},
        {id:"8",name:"Oscar", age:"1.5 Years", price:"₹13,000", img:"https://images.pexels.com/photos/27871001/pexels-photo-27871001.jpeg"},
        {id:"9",name:"Thor", age:"2 Years", price:"₹14,000", img:"https://images.pexels.com/photos/4723830/pexels-photo-4723830.jpeg"},
        {id:"10",name:"Zeus", age:"2.5 Years", price:"₹15,000", img:"https://images.pexels.com/photos/28429272/pexels-photo-28429272.jpeg"}
    ],
    "Maine":[
        {id:"11",name:"Coco", age:"1 Year", price:"₹6,000", img:"https://images.pexels.com/photos/32550440/pexels-photo-32550440.jpeg"},
        {id:"12",name:"Milo", age:"2 Years", price:"₹6,500", img:"https://images.pexels.com/photos/33550457/pexels-photo-33550457.jpeg"},
        {id:"13",name:"Nemo", age:"1.5 Years", price:"₹7,000", img:"https://images.pexels.com/photos/15765391/pexels-photo-15765391.jpeg"},
        {id:"14",name:"Peanut", age:"2 Years", price:"₹6,800", img:"https://images.pexels.com/photos/14840603/pexels-photo-14840603.jpeg"},
        {id:"15",name:"Loki", age:"1 Year", price:"₹7,200", img:"https://images.pexels.com/photos/7445055/pexels-photo-7445055.jpeg"}
    ],
    "Bengal":[
        {id:"16",name:"Simba", age:"2 Years", price:"₹14,000", img:"https://images.pexels.com/photos/27871001/pexels-photo-27871001.jpeg"},
        {id:"17",name:"Bailey", age:"1.5 Years", price:"₹15,000", img:"https://images.pexels.com/photos/17885998/pexels-photo-17885998.jpeg"},
        {id:"18",name:"Shadow", age:"3 Years", price:"₹13,500", img:"https://images.pexels.com/photos/15765370/pexels-photo-15765370.jpeg"},
        {id:"19",name:"Teddy", age:"2 Years", price:"₹14,200", img:"https://images.pexels.com/photos/6131540/pexels-photo-6131540.jpeg"},
        {id:"20",name:"Hunter", age:"1 Year", price:"₹16,000", img:"https://images.pexels.com/photos/28429272/pexels-photo-28429272.jpeg"}
    ],
    "Ragdoll":[
        {id:"21",name:"Jack", age:"2 Years", price:"₹9,000", img:"https://images.pexels.com/photos/4723830/pexels-photo-4723830.jpeg"},
        {id:"22",name:"Oliver", age:"1.5 Years", price:"₹9,500", img:"https://images.pexels.com/photos/5380197/pexels-photo-5380197.jpeg"},
        {id:"23",name:"Bingo", age:"3 Years", price:"₹8,800", img:"https://images.pexels.com/photos/7445032/pexels-photo-7445032.jpeg"},
        {id:"24",name:"Finn", age:"2 Years", price:"₹9,200", img:"https://images.pexels.com/photos/32550440/pexels-photo-32550440.jpeg"},
        {id:"25",name:"Ben", age:"1 Year", price:"₹10,000", img:"https://images.pexels.com/photos/1644767/pexels-photo-1644767.jpeg"}
    ]
};

function loadCats(filter="All"){
    const container=document.getElementById("catsContainer");
    container.innerHTML="";

    for(let breed in cats){
        if(filter!=="All" && filter!==breed) continue;

        container.innerHTML+=`
        <div class="breed-title">${breed}</div>
         <div class="grid" id="${breed.replace(/\s/g,'')}"></div>
         ;`

        cats[breed].forEach(cat=>{
            document.getElementById(breed.replace(/\s/g,'')).innerHTML+=`
            <div class="card" style="background:url('${cat.img}') center/cover">
                <div class="overlay">
                    <h3>${cat.name}</h3>
                    <p>ID:${cat.id}</p>
                    <p>Age: ${cat.age}</p>
                    <p>Price: ${cat.price}</p>
                    <button class="btn adopt" onclick="adoptPet(
                   '${cat.name}',
                   '${cat.id}',
                   '${cat.age}',
                   '${breed}',
                   '${cat.price}',
                   '${cat.img}'
                   )">Adopt Me</button>


                    <button class="btn wishlist"
                        onclick="addToWishlist('${cat.name}','${cat.id}',${breed}','${cat.img}','${cat.price}')">
                        Wishlist
                    </button>
                </div>
            </div>`;
        });
    }
}

function filterBreed(){
    loadCats(document.getElementById("breedFilter").value);
}

/* WISHLIST */
function addToWishlist(name,id,breed,img,price){
    let wishlist=JSON.parse(localStorage.getItem("wishlist"))||[];
    if(wishlist.some(d=>d.name===name)){
        alert("Already in wishlist ❤️");
        return;
    }
    wishlist.push({name,id,breed,img,price});
    localStorage.setItem("wishlist",JSON.stringify(wishlist));
    alert(name+" added to wishlist 🐾");
}

/* ✅ ADOPT → FLASK ROUTE */
function adoptPet(name,id, age, breed, price, img){
    // Optional: store selected pet
    localStorage.setItem("adoptPet", JSON.stringify({
        name,id, age, breed, price, img
    }));

    // 🔥 CORRECT REDIRECT TO ADOPTION FORM
    window.location.href = "/adoption";
}

loadCats();
</script>

</body>
</html>
