<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Pet Adoption Portal</title>
<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  height:100vh;
  font-family:Arial, sans-serif;
  background:url('https://images.pexels.com/photos/29607281/pexels-photo-29607281.jpeg') no-repeat center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
}

.form-box{
  width:360px;
  padding:30px;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(10px);
  border-radius:12px;
  text-align:center;
  color:#fff;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:6px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#873ddc;
  border:none;
  color:#fff;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
}

.admin-btn{
  background:#873ddc;
  margin-top:10px;
}

a{
  color:#fff;
  font-weight:bold;
  text-decoration:none;
}
.links{
  margin-top:15px;
}
</style>
</head>

<body>

<div class="form-box">
  <h2>User Login</h2>

  <!-- USER LOGIN FORM -->
  <form method="POST" action="/login">
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <!-- LINKS OUTSIDE FORM -->
  <div class="links">
    <p><a href="/register-page">New User? Register</a></p>

    <!-- Dashboard link for testing -->
    <a href="/dashboard"></a>

    <!-- ADMIN LOGIN BUTTON -->
    <button class="admin-btn" onclick="window.location.href='/admin'">
      Admin Login
    </button>
  </div>
</div>

</body>
</html>
